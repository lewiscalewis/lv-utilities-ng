<div class="carousel" [style]="selector">
    <div class="image-container-wrapper">
      <div class="image-container" [@slideAnimation]="currentIndex">
        <img id="slide" [src]="slides[currentIndex].src" [alt]="slides[currentIndex].descripcion">
      </div>
    </div>
    <div class="user-controls" *ngIf="theme === 'light-theme'">
      <img src="https://raw.githubusercontent.com/lewiscalewis/lv-utilities-assets/71e25fb4c6915c0d2c56182a15b99e34d75042ac/assets/slider-icons/chevron-left-square-svgrepo-com.svg" alt="anterior" (click)="anterior()">
      <div class="slide-name">{{slides[currentIndex].nombre}}</div>
      <img src="https://raw.githubusercontent.com/lewiscalewis/lv-utilities-assets/71e25fb4c6915c0d2c56182a15b99e34d75042ac/assets/slider-icons/chevron-right-square-svgrepo-com.svg" alt="anterior" (click)="siguiente()">
    </div>
    <div class="user-controls" *ngIf="theme === 'dark-theme'">
        <img src="https://raw.githubusercontent.com/lewiscalewis/lv-utilities-assets/71e25fb4c6915c0d2c56182a15b99e34d75042ac/assets/slider-icons/chevron-left-square-svgrepo-com-dark.svg" alt="anterior" (click)="anterior()">
        <div class="slide-name">{{slides[currentIndex].nombre}}</div>
        <img src="https://raw.githubusercontent.com/lewiscalewis/lv-utilities-assets/71e25fb4c6915c0d2c56182a15b99e34d75042ac/assets/slider-icons/chevron-right-square-svgrepo-com-dark.svg" alt="anterior" (click)="siguiente()">
      </div>
  </div>
