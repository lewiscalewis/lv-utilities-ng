<div class="lv-container">
    <div class="lv-search">
        <p>Buscar: </p>
        <input type="text" style="color:black" (keyup)="search($event)" (blur)="closeList()">
        <img src="https://raw.githubusercontent.com/lewiscalewis/lv-utilities-assets/71e25fb4c6915c0d2c56182a15b99e34d75042ac/assets/search-icons/search-status-svgrepo-com.svg" alt="buscar">
    </div>
    <div class="results" *ngIf="results.length > 0 && showResultList">
        <ul>
            <li *ngFor="let result of list" (click)="sendData(result)">{{ printObject(result) }}</li>
        </ul>
    </div>
</div>
